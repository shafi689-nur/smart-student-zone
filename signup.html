<!DOCTYPE html>
<html>
<head>
<title>Signup</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="bg">
  <div class="box">

    <img class="logo" src="logo.png" alt="Daffodil Logo">

    <h2>Student Signup</h2>

    <input id="su_name" placeholder="Name">
    <input id="su_email" placeholder="Email">
    <input id="su_pass" type="password" placeholder="Password">

    <button class="signup-btn" onclick="signup()">Create Account</button>

  </div>
</div>

<script src="auth.js"></script>

</body>
</html>
